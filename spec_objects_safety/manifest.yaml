manifest_version: 1.0.0
name: spec-objects-safety
version: 0.3.0
description: 'Filament Module: safety ObjectTypes (hazard, failure_mode) — IEC 61508 / ISO 26262 / FMEA lineage'
semantic:
  # quoin FR-070. Declared at the module level, so a consumer that cannot read
  # this contract version refuses the module explicitly instead of loading it as
  # an empty model.
  contract_version: 1.0.0
  semantic_core: 0.1.0
  package: agent-ix/spec-objects-safety
  exports:
  - hazard
  - failure_mode
  # EMPTY ON PURPOSE, and not a claim that this module stands alone. A hazard
  # references controls (`agent-ix/spec-objects-security` `control`), risks
  # (`risk`), the interfaces and components a failure mode sits in
  # (`agent-ix/spec-objects-architecture`), the incidents that realised it
  # (`agent-ix/spec-objects-operational`) and the evidence that supports a
  # judgement (`agent-ix/engineering-assurance`) — every one of them BY
  # `SemanticId` REFERENCE, never redeclared here. `imports` pins imported
  # semantic PACKAGES at exact versions, and none of those four has published a
  # semantic contract yet: agent-ix/spec-objects-security#13,
  # agent-ix/spec-objects-architecture#8 and agent-ix/spec-objects-operational#6
  # are the open migration tickets. Pinning a version they do not yet declare
  # would be a false claim, so the map stays empty and FR-006 records the
  # obligation to fill it.
  imports: {}
  targets: [json-schema, markdown]
  mappings: [typed-table, sysml-fence, ocl-clause]
  compatibility_posture: additive
  legacy_forms: warning
# Order 55, following the family sequence (operational 53, security 54).
nav:
  category:
    slug: safety
    label: Safety
    icon: ShieldAlert
    order: 55
archetypes: []
grammars: []
artifact_types: []

# Advisory lint rules (quire-rs FR-036). Evaluated by `quire lint`; never
# blocks validation, extraction or sync.
#
# Severity and likelihood are the two axes every safety standard scores a
# hazard on, and every standard uses a different scale. These are the ordinal
# buckets the ecosystem authors in; a repository working to a specific standard
# maps its own scale onto them rather than inventing a column.
#
# WIDENED AT 0.3.0 with `unknown`, `not_assessed` and `not_applicable`, the
# three `EpistemicState` members the emitted schemas admit on every scored axis
# (FR-004). At 0.2.0 the only way past this advisory was to write a scale
# value, so an author who had not scored an axis was nudged towards
# `negligible` or `none` — the exact collapse this module exists to prevent.
# Widening an advisory allow-list to admit "nobody has looked" is not a
# relaxation of the gate; refusing the honest token was the defect.
lint_rules:
- type: table_column_values
  id: hazard-severity
  section: Assessment
  column: Severity
  allowed: [negligible, marginal, critical, catastrophic, unknown, not_assessed, not_applicable]
- type: table_column_values
  id: hazard-likelihood
  section: Assessment
  column: Likelihood
  allowed: [incredible, improbable, remote, occasional, probable, frequent, unknown, not_assessed, not_applicable]
- type: table_column_values
  id: failure-mode-detection
  section: Analysis
  column: Detection
  allowed: [none, indirect, direct, automatic, unknown, not_assessed, not_applicable]

object_types:
# ── hazard ───────────────────────────────────────────────────────────────
#
# A hazard is a *system state or condition* that can lead to harm. It is not a
# failure and not a threat:
#
#   * a **threat** (spec-objects-security) is an adversary acting on an asset;
#     the STRIDE lineage. Its question is "who would attack this".
#   * a **failure_mode** is a component behaving wrongly; the FMEA lineage.
#     Its question is "what breaks".
#   * a **hazard** is the state that can harm someone, whether reached by
#     attack, by failure, or by correct components interacting badly. Its
#     question is "what state must never be reached".
#
# STPA exists because the third is not the union of the first two: a hazard can
# arise from components each behaving exactly as specified. Modelling hazards as
# a variety of failure_mode would lose precisely those.
- name: hazard
  allowed_links:
    # NO NEW VERBS. spec-artifacts-iso FR-004's first criterion for adding one
    # is "check the existing 76 — a near-synonym is a reason not to add", and
    # there is one: `arises_from` ("Risk arises from a threat/vulnerability",
    # governance) records exactly this fact, read from the hazard end, which is
    # also the natural authoring direction. A hazard arising from several
    # failure modes is several `arises_from` edges, so a separate
    # `contributes_to` would be a second word for the same thing.
    #
    # The ticket (spec-objects-security#7) assumed `causes`/`contributes_to`
    # would be added to the iso vocabulary. Applying the criteria that ticket
    # asked for says not to.
    arises_from: [failure_mode]
    references: [hazard, failure_mode]
  data_schema:
    schema: schemas/Hazard.json
    digest: sha256:bde56fb1e4445bdcd7e1a61ef2eded7df5974a830ca03bc0e88b2dd72aad66f6
  body_extraction:
    yield_pattern:
      match:
        id: &id001
          from: frontmatter_field
          path:
          - id
          required: true
        title: &id002
          from: frontmatter_field
          path:
          - title
          required: true
        type: &id003
          from: frontmatter_field
          path:
          - type
          required: true
        # The state, stated as a state. A hazard written as an event ("the
        # brakes fail") is a failure mode wearing a hazard's name; written as a
        # state ("the vehicle cannot decelerate") it stays true regardless of
        # which failure produced it, which is what lets several failure modes
        # link to one hazard.
        condition:
          from: section_body
          after_heading: Condition
          required: true
        # Severity and likelihood in one required table, so a hazard cannot be
        # recorded unscored. An unscored hazard cannot be prioritised, and a
        # backlog of unscored hazards is indistinguishable from no analysis.
        assessment:
          from: table_row
          under_section: Assessment
          required: true
          assert:
            columns:
            - Severity
            - Likelihood
            - Rationale
            min_rows: 1
        # What keeps the state from being reached, or limits harm once it is.
        # Optional on purpose: an identified-but-unmitigated hazard is a real
        # and reportable state, and requiring the section would push authors to
        # write a placeholder rather than leave the gap visible.
        mitigation:
          from: section_body
          after_heading: Mitigation
          required: false
        # ADDED AT 0.3.0, `required: false` in both types so every 0.2.0
        # artifact stays valid (NFR-001). The typed `## Properties` table is
        # the semantic-module default form and a ```sysml``` fence is the
        # alternate; `## Invariants` carries one ```ocl``` fence per clause.
        # Quire's semantic extractor reads both from the document; these
        # locators additionally yield them as strings beside the record, which
        # is what a reader with no semantic support still sees.
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false

# ── failure_mode ─────────────────────────────────────────────────────────
#
# Separate from `hazard`, not a variant of it — see the note above. The FMEA
# triple (effect, cause, detection) is a different shape from the hazard
# assessment (severity, likelihood), and collapsing them would force one table
# to mean two things depending on which type declared it.
- name: failure_mode
  allowed_links:
    # The causal edge is authored from the hazard end (`arises_from`), so a
    # failure mode declares no outgoing safety verb of its own — one edge, one
    # place to write it.
    references: [failure_mode, hazard]
  data_schema:
    schema: schemas/FailureMode.json
    digest: sha256:b5aec534643886d20ff93015e7f41473781c3b6d7ca20f90e35b9f124c985336
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        # What the component does instead of what it should.
        description:
          from: section_body
          after_heading: Description
          required: true
        # The FMEA triple, in one required table. `Detection` is the column
        # that earns the type: a failure nobody can detect is a different
        # engineering problem from the same failure with an alarm on it, and
        # nothing in the severity/likelihood pair carries that.
        analysis:
          from: table_row
          under_section: Analysis
          required: true
          assert:
            columns:
            - Effect
            - Cause
            - Detection
            min_rows: 1
        # ADDED AT 0.3.0, `required: false` in both types so every 0.2.0
        # artifact stays valid (NFR-001). The typed `## Properties` table is
        # the semantic-module default form and a ```sysml``` fence is the
        # alternate; `## Invariants` carries one ```ocl``` fence per clause.
        # Quire's semantic extractor reads both from the document; these
        # locators additionally yield them as strings beside the record, which
        # is what a reader with no semantic support still sees.
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false

# FR-058 (quire-rs v0.31.0): upward-trace completeness. THE POINT OF THIS
# MODULE, and the reason agent-ix/spec-objects-security#5 exists.
#
# Downward coverage answers "is what we wrote verified". It cannot answer "is
# anything missing", because nothing operating over the existing spec text can:
# a hazard nobody mitigated leaves no trace to follow. Reading the edge set in
# the other direction does.
#
# Every field here is data. The engine holds no archetype name, no verb and no
# direction — a different module states a different chain with the same code.
traceability:
  required_relations:
  # A hazard nothing mitigates is a risk that was identified and then dropped.
  # This is the finding that cannot be produced any other way: the hazard
  # document is perfectly well-formed, passes every schema and grammar check,
  # and is still evidence of an unaddressed risk.
  #
  # `direction: incoming` because the mitigation is authored from the
  # requirement's end — an FR says what it mitigates. The hazard does not list
  # its own mitigations, which would duplicate the fact and let the two drift.
  - name: hazard-has-mitigation
    from: hazard
    edges: [mitigates]
    to: []
    direction: incoming
    check: unmitigated-hazard
  # A failure mode nothing mitigates is the same statement one level down.
  # Kept separate rather than folded into the relation above so each is tunable
  # on its own `trace:<check>` key (FR-057): a repository may want unmitigated
  # hazards at `error` while failure-mode coverage is still being backfilled.
  - name: failure-mode-has-mitigation
    from: failure_mode
    edges: [mitigates]
    to: []
    direction: incoming
    check: unmitigated-failure-mode
  # A hazard that transitively arises from itself states nothing, and no
  # per-document check can see it — the defect is a property of the graph.
  acyclic_edges:
  - arises_from

# FR-043: concrete-term lexicon — safety-domain terms. Definitions are quoted
# because a YAML flow mapping treats an unquoted comma as an entry separator,
# which silently truncated two definitions in spec-objects-security
# (agent-ix/spec-objects-security#6).
lexicon:
  hazard: {definition: "a system state or condition that can lead to harm"}
  harm: {definition: "physical injury, damage to health, or damage to property or environment"}
  failure mode: {definition: "the manner in which a component fails to perform its intended function"}
  severity: {definition: "how bad the harm is if the hazard is realised"}
  likelihood: {definition: "how often the hazard state is expected to be reached"}
  detection: {definition: "whether, and how directly, a failure can be observed before it causes harm"}
  mitigation: {definition: "a measure that prevents a hazard state or limits the harm it causes"}
  safety function: {definition: "a function whose failure directly contributes to a hazard"}
